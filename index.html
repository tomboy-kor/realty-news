<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11/15 오늘의 부동산 뉴스 탑10 - 복남이네 부동산</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#12161c; --muted:#6b7480; --line:#e5e8ec;
    --accent:#1f6feb; --accent-soft:#e8f0fe; --chip:#f1f3f6; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);
  }
  html[data-theme="dark"]{
    --bg:#0e1116; --panel:#161a21; --ink:#e7ebf0; --muted:#9aa4b2; --line:#242a33;
    --accent:#5b9bff; --accent-soft:#16233a; --chip:#1c222b; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
  /* 스크립트가 뜨기 전(또는 실행되지 않을 때)에도 다크 모드가 맞도록 */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --panel:#161a21; --ink:#e7ebf0; --muted:#9aa4b2; --line:#242a33;
      --accent:#5b9bff; --accent-soft:#16233a; --chip:#1c222b; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.55}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 72px}

  /* header */
  header{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .head-in{max-width:980px;margin:0 auto;padding:16px 20px}
  .head-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:-.4px;font-weight:800;word-break:keep-all}
  h1 .dot{color:var(--accent)}
  /* 로고: 카드뉴스와 같은 흰 바탕 정사각형 타일 (그림은 페이지에 넣어 둠 — 웹·공유 파일에서도 보이게) */
  h1 .brand{white-space:nowrap}
  h1 .logo{width:1.25em;height:1.25em;border-radius:5px;background:#fff;vertical-align:-.25em;margin-right:.3em}
  .head-meta{color:var(--muted);font-size:13px;margin-left:auto;display:flex;gap:10px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;
    padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  select.btn{padding:6px 8px}

  .toolbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
  #q{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
  #q:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{white-space:nowrap;border:1px solid var(--line);background:var(--chip);color:var(--muted);
    border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
  .tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab .n{opacity:.75;font-weight:500;margin-left:4px}

  /* summary strip */
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:20px 0 8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px;letter-spacing:-.5px}
  .stat span{color:var(--muted);font-size:12px}

  .kw{margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .kw .label{color:var(--muted);font-size:12px;margin-right:2px}
  .kw button{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;
    padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .kw button:hover{color:var(--accent);border-color:var(--accent)}
  .kw button i{font-style:normal;opacity:.6;margin-left:4px}

  /* list */
  .group-title{margin:26px 0 10px;font-size:14px;font-weight:800;color:var(--muted);
    display:flex;align-items:center;gap:8px;letter-spacing:.2px}
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}
  ul.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
  li.card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card .t{font-size:15.5px;font-weight:700;letter-spacing:-.2px;display:block}
  .card .s{color:var(--muted);font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .card .m{margin-top:9px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .badge{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 7px;font-weight:700}
  .src{font-weight:600;color:var(--ink);opacity:.75}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}

  /* 네이버 조회수 TOP */
  .top{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:16px 18px 10px;margin:18px 0 6px}
  .top-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .top-head h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px}
  .top-head .sub{color:var(--muted);font-size:12px}
  .top-head .btn{margin-left:auto;padding:4px 10px;font-size:12px}
  ol.rank{list-style:none;margin:0;padding:0}
  ol.rank li{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;
    padding:10px 0;border-top:1px solid var(--line)}
  ol.rank li:first-child{border-top:0}
  .rank .no{font-size:15px;font-weight:800;color:var(--muted);text-align:center}
  .rank li:nth-child(-n+3) .no{color:var(--accent)}
  .rank .tl{min-width:0}
  .rank .t{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .rank a:hover .t{color:var(--accent)}
  .rank .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rank .meta{grid-column:2 / 4;display:grid;grid-template-columns:96px minmax(60px,260px);align-items:center;
    gap:8px;font-size:12px;color:var(--muted)}
  .rank .meta .src{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank .bar{height:4px;border-radius:2px;background:var(--chip);overflow:hidden}
  .rank .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
  .top-foot{color:var(--muted);font-size:11.5px;padding:8px 0 4px;border-top:1px solid var(--line)}
  .views{font-weight:700;color:var(--accent)}

  .empty{text-align:center;color:var(--muted);padding:60px 0}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 0 0;border-top:1px solid var(--line);margin-top:36px}
  footer code{background:var(--chip);padding:2px 6px;border-radius:5px}
  @media (max-width:520px){ h1{font-size:19px} .head-meta{width:100%;margin-left:0} }
</style>
</head>

const ARCHIVE = [];
const BASE = "artifact";  // index: "archive/", 보관본: ""

/* ---------- theme ---------- */
const root = document.documentElement;
const saved = localStorage.getItem("realty-theme");
const stamped = root.getAttribute("data-theme");  // 아티팩트 뷰어가 지정한 테마 존중
root.dataset.theme = saved || stamped ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.getElementById("theme").onclick = () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("realty-theme", root.dataset.theme);
};

/* ---------- state ---------- */
let state = { cat: "전체", q: "", sort: "time" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function ago(ts){
  const m = Math.floor((Date.now()/1000 - ts)/60);
  if (m < 1) return "방금";
  if (m < 60) return m + "분 전";
  const h = Math.floor(m/60);
  if (h < 24) return h + "시간 전";
  return Math.floor(h/24) + "일 전";
}
function hi(text, q){
  const t = esc(text);
  if (!q) return t;
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"), m => "<mark>"+m+"</mark>");
}

/* ---------- header meta ---------- */
const gen = new Date(DATA.generated_at);
document.getElementById("updated").textContent =
  DATA.date + " · " + gen.getHours().toString().padStart(2,"0") + ":" +
  gen.getMinutes().toString().padStart(2,"0") + " 기준";
document.getElementById("gen").textContent =
  "수집 시각 " + gen.toLocaleString("ko-KR") + " · 최근 " + DATA.window_hours + "시간 기사 " + DATA.total + "건";

const sel = document.getElementById("archive");
sel.innerHTML = "<option value=''>지난 뉴스</option>" +
  (ARCHIVE||[]).map(d => "<option value='" + d + "'>" + d + "</option>").join("");
sel.onchange = () => { if (sel.value) location.href = BASE + sel.value + ".html"; };
if (BASE === "artifact") sel.style.display = "none";  // 웹 공유본에는 로컬 보관본이 없다
if (BASE === ""){  // 보관본 페이지에서는 오늘 뉴스로 돌아가는 링크를 보여준다
  const back = document.createElement("a");
  back.className = "btn"; back.href = "../index.html"; back.textContent = "← 오늘 뉴스";
  document.querySelector(".head-meta").prepend(back);
}

/* ---------- tabs ---------- */
const tabs = document.getElementById("tabs");
const cats = [{name:"전체", count:DATA.total}].concat(DATA.categories.filter(c => c.count > 0));
tabs.innerHTML = cats.map(c =>
  "<button class='tab' data-cat='"+esc(c.name)+"' aria-pressed='"+(c.name==="전체")+"'>"+
  esc(c.name)+"<span class='n'>"+c.count+"</span></button>").join("");
tabs.onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat;
  [...tabs.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};

/* ---------- stats ---------- */
const topSrc = (DATA.sources||[]).slice(0,1)[0];
const topCat = DATA.categories.slice().sort((a,b)=>b.count-a.count)[0] || {name:"-",count:0};
document.getElementById("strip").innerHTML = [
  ["<b>"+DATA.total+"</b><span>오늘 모은 기사</span>"],
  ["<b>"+esc(topCat.name)+"</b><span>가장 많은 주제 ("+topCat.count+"건)</span>"],
  ["<b>"+esc(topSrc ? topSrc.name : "-")+"</b><span>최다 보도 매체</span>"],
  ["<b>"+(DATA.source_count||(DATA.sources||[]).length)+"</b><span>언론사 수</span>"]
].map(s => "<div class='stat'>"+s+"</div>").join("");

/* ---------- keywords ---------- */
const kw = document.getElementById("kw");
kw.innerHTML = "<span class='label'>오늘의 키워드</span>" +
  (DATA.keywords||[]).map(k =>
    "<button data-w='"+esc(k.word)+"'>"+esc(k.word)+"<i>"+k.count+"</i></button>").join("");
kw.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const w = b.dataset.w;
  const box = document.getElementById("q");
  box.value = (state.q === w) ? "" : w;
  state.q = box.value; render();
};

/* ---------- search / sort ---------- */
const qbox = document.getElementById("q");
qbox.oninput = () => { state.q = qbox.value.trim(); render(); };
const sortBtn = document.getElementById("sort");
sortBtn.onclick = () => {
  state.sort = state.sort === "time" ? "cat" : "time";
  sortBtn.textContent = state.sort === "time" ? "최신순" : "주제별";
  render();
};

/* ---------- render ---------- */
function cardHTML(a){
  return "<li class='card'><a href='"+esc(a.link)+"' target='_blank' rel='noopener'>"+
    "<span class='t'>"+hi(a.title, state.q)+"</span>"+
    (a.summary ? "<span class='s'>"+hi(a.summary, state.q)+"</span>" : "")+
    "<span class='m'><span class='badge'>"+esc(a.category)+"</span>"+
    "<span class='src'>"+hi(a.source, state.q)+"</span><span>·</span><span>"+ago(a.ts)+"</span>"+
    (a.views ? "<span>·</span><span class='views'>조회 "+fmt(a.views)+"</span>" : "")+"</span>"+
    "</a></li>";
}

/* ---------- 네이버 조회수 TOP ---------- */
const fmt = n => Number(n).toLocaleString("ko-KR");
let topOpen = false;
function renderTop(){
  const box = document.getElementById("top");
  const R = DATA.naver_ranking;
  if (!R || !R.articles) { box.hidden = true; return; }  // 조회수 수집 전 보관본
  const all = R.articles.filter(a => a.views && (state.cat === "전체" || a.category === state.cat));
  if (!all.length) { box.hidden = true; return; }
  const list = all.slice(0, topOpen ? 20 : 10);
  const max = all[0].views;
  const at = new Date(R.collected_at);
  const hhmm = at.getHours().toString().padStart(2,"0") + ":" + at.getMinutes().toString().padStart(2,"0");
  // window 는 "오전 11시 ~ 정오" 처럼 직전 1시간 구간이고, 조회수는 0시부터 그 끝까지의 누적이다
  const until = (R.window || "").split("~").pop().trim();
  const hidden = R.articles.filter(a => !a.views).length;
  box.hidden = false;
  box.innerHTML =
    "<div class='top-head'><h2>네이버 조회수 TOP</h2>"+
    "<span class='sub'>"+(state.cat === "전체" ? "" : esc(state.cat)+" · ")+
      (until ? "오늘 0시 ~ "+esc(until)+" 누적" : "오늘 누적")+" · "+hhmm+" 수집</span>"+
    (all.length > 10 ? "<button class='btn' id='topMore'>"+(topOpen ? "접기" : "20위까지")+"</button>" : "")+
    "</div><ol class='rank'>"+
    list.map((a, i) =>
      "<li><span class='no'>"+(i+1)+"</span>"+
      "<a class='tl' href='"+esc(a.link)+"' target='_blank' rel='noopener'><span class='t'>"+esc(a.title)+"</span></a>"+
      "<span class='v'>"+fmt(a.views)+"</span>"+
      "<span class='meta'><span class='src'>"+esc(a.source)+"</span>"+
      "<span class='bar' aria-hidden='true'><i style='width:"+Math.max(2, a.views / max * 100).toFixed(1)+"%'></i></span></span>"+
      "</li>").join("")+
    "</ol><div class='top-foot'>네이버 언론사별 '많이 본 뉴스'·경제 랭킹("+(R.press_count||0)+"곳) 중 부동산 기사"+
    (hidden ? " · 조회수 비공개 언론사 기사 "+hidden+"건 제외" : "")+"</div>";
  const more = document.getElementById("topMore");
  if (more) more.onclick = () => { topOpen = !topOpen; renderTop(); };
}

function render(){
  renderTop();
  const q = state.q.toLowerCase();
  let items = DATA.articles.filter(a =>
    (state.cat === "전체" || a.category === state.cat) &&
    (!q || (a.title + " " + a.source + " " + a.summary).toLowerCase().includes(q)));

  const out = document.getElementById("out");
  if (!items.length){ out.innerHTML = "<div class='empty'>조건에 맞는 기사가 없습니다.</div>"; return; }

  if (state.sort === "time"){
    out.innerHTML = "<ul class='list'>" + items.map(cardHTML).join("") + "</ul>";
  } else {
    const groups = {};
    items.forEach(a => (groups[a.category] = groups[a.category] || []).push(a));
    out.innerHTML = DATA.categories.map(c => c.name).filter(c => groups[c])
      .map(c => "<div class='group-title'>"+esc(c)+" <span style='color:var(--accent)'>"+groups[c].length+"</span></div>"+
                "<ul class='list'>"+groups[c].map(cardHTML).join("")+"</ul>").join("");
  }
}
render();

/* 키보드: / 로 검색창 포커스 */
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qbox){ e.preventDefault(); qbox.focus(); }
});
</script>
</body>
</html>
