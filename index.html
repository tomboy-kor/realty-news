  .kw button:hover{color:var(--accent);border-color:var(--accent)}
  .kw button i{font-style:normal;opacity:.6;margin-left:4px}

  /* list */
  .group-title{margin:26px 0 10px;font-size:14px;font-weight:800;color:var(--muted);

  .src{font-weight:600;color:var(--ink);opacity:.75}
  mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}

  footer{color:var(--muted);font-size:12px;text-align:center;padding:28px 0 0;border-top:1px solid var(--line);margin-top:36px}

const ARCHIVE = [];
const BASE = "artifact";  // index: "archive/", 보관본: ""

/* ---------- theme ---------- */
const root = document.documentElement;
const saved = localStorage.getItem("realty-theme");
const stamped = root.getAttribute("data-theme");  // 아티팩트 뷰어가 지정한 테마 존중
root.dataset.theme = saved || stamped ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
document.getElementById("theme").onclick = () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("realty-theme", root.dataset.theme);
};

/* ---------- state ---------- */
let state = { cat: "전체", q: "", sort: "time" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function ago(ts){
  const m = Math.floor((Date.now()/1000 - ts)/60);
  if (m < 1) return "방금";
  if (m < 60) return m + "분 전";
  const h = Math.floor(m/60);
  if (h < 24) return h + "시간 전";
  return Math.floor(h/24) + "일 전";
}
function hi(text, q){
  const t = esc(text);
  if (!q) return t;
  return t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi"), m => "<mark>"+m+"</mark>");
}

/* ---------- header meta ---------- */
const gen = new Date(DATA.generated_at);
document.getElementById("updated").textContent =
  DATA.date + " · " + gen.getHours().toString().padStart(2,"0") + ":" +
  gen.getMinutes().toString().padStart(2,"0") + " 기준";
document.getElementById("gen").textContent =
  "수집 시각 " + gen.toLocaleString("ko-KR") + " · 최근 " + DATA.window_hours + "시간 기사 " + DATA.total + "건";

const sel = document.getElementById("archive");
sel.innerHTML = "<option value=''>지난 뉴스</option>" +
  (ARCHIVE||[]).map(d => "<option value='" + d + "'>" + d + "</option>").join("");
sel.onchange = () => { if (sel.value) location.href = BASE + sel.value + ".html"; };
if (BASE === "artifact") sel.style.display = "none";  // 웹 공유본에는 로컬 보관본이 없다
if (BASE === ""){  // 보관본 페이지에서는 오늘 뉴스로 돌아가는 링크를 보여준다
  const back = document.createElement("a");
  back.className = "btn"; back.href = "../index.html"; back.textContent = "← 오늘 뉴스";
  document.querySelector(".head-meta").prepend(back);
}

/* ---------- tabs ---------- */
const tabs = document.getElementById("tabs");
const cats = [{name:"전체", count:DATA.total}].concat(DATA.categories.filter(c => c.count > 0));
tabs.innerHTML = cats.map(c =>
  "<button class='tab' data-cat='"+esc(c.name)+"' aria-pressed='"+(c.name==="전체")+"'>"+
  esc(c.name)+"<span class='n'>"+c.count+"</span></button>").join("");
tabs.onclick = e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.cat = b.dataset.cat;
  [...tabs.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
};

/* ---------- stats ---------- */
const topSrc = (DATA.sources||[]).slice(0,1)[0];
const topCat = DATA.categories.slice().sort((a,b)=>b.count-a.count)[0] || {name:"-",count:0};
document.getElementById("strip").innerHTML = [
  ["<b>"+DATA.total+"</b><span>오늘 모은 기사</span>"],
  ["<b>"+esc(topCat.name)+"</b><span>가장 많은 주제 ("+topCat.count+"건)</span>"],
  ["<b>"+esc(topSrc ? topSrc.name : "-")+"</b><span>최다 보도 매체</span>"],
  ["<b>"+(DATA.source_count||(DATA.sources||[]).length)+"</b><span>언론사 수</span>"]
].map(s => "<div class='stat'>"+s+"</div>").join("");

/* ---------- keywords ---------- */
const kw = document.getElementById("kw");
kw.innerHTML = "<span class='label'>오늘의 키워드</span>" +
  (DATA.keywords||[]).map(k =>
    "<button data-w='"+esc(k.word)+"'>"+esc(k.word)+"<i>"+k.count+"</i></button>").join("");
kw.onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  const w = b.dataset.w;
  const box = document.getElementById("q");
  box.value = (state.q === w) ? "" : w;
  state.q = box.value; render();
};

/* ---------- search / sort ---------- */
const qbox = document.getElementById("q");
qbox.oninput = () => { state.q = qbox.value.trim(); render(); };
const sortBtn = document.getElementById("sort");
sortBtn.onclick = () => {
  state.sort = state.sort === "time" ? "cat" : "time";
  sortBtn.textContent = state.sort === "time" ? "최신순" : "주제별";
  render();
};

/* ---------- render ---------- */
function cardHTML(a){
  return "<li class='card'><a href='"+esc(a.link)+"' target='_blank' rel='noopener'>"+
    "<span class='t'>"+hi(a.title, state.q)+"</span>"+
    (a.summary ? "<span class='s'>"+hi(a.summary, state.q)+"</span>" : "")+
    "<span class='m'><span class='badge'>"+esc(a.category)+"</span>"+
    "<span class='src'>"+hi(a.source, state.q)+"</span><span>·</span><span>"+ago(a.ts)+"</span></span>"+
    "</a></li>";
}

function render(){
  const q = state.q.toLowerCase();
  let items = DATA.articles.filter(a =>
    (state.cat === "전체" || a.category === state.cat) &&
    (!q || (a.title + " " + a.source + " " + a.summary).toLowerCase().includes(q)));

  const out = document.getElementById("out");
  if (!items.length){ out.innerHTML = "<div class='empty'>조건에 맞는 기사가 없습니다.</div>"; return; }

  if (state.sort === "time"){
    out.innerHTML = "<ul class='list'>" + items.map(cardHTML).join("") + "</ul>";
  } else {
    const groups = {};
    items.forEach(a => (groups[a.category] = groups[a.category] || []).push(a));
    out.innerHTML = DATA.categories.map(c => c.name).filter(c => groups[c])
      .map(c => "<div class='group-title'>"+esc(c)+" <span style='color:var(--accent)'>"+groups[c].length+"</span></div>"+
                "<ul class='list'>"+groups[c].map(cardHTML).join("")+"</ul>").join("");
  }
}
render();

/* 키보드: / 로 검색창 포커스 */
addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qbox){ e.preventDefault(); qbox.focus(); }
});
</script>
